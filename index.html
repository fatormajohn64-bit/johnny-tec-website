<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Johnny Tec AI</title>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --panel-bg: #131722;
            --border-color: #232936;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
            --accent-purple: #c084fc;
            --accent-green: #22c55e;
            --user-msg-bg: #1e293b;
            --ai-msg-bg: #182232;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #64748b;
        }

        .indicator.online {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* Chat Area */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            align-self: flex-end;
        }

        .message-row.ai {
            align-self: flex-start;
        }

        .sender-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message-row.user .bubble {
            background-color: var(--user-msg-bg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .message-row.ai .bubble {
            background-color: var(--ai-msg-bg);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        /* Typing Dots Animation */
        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Controls */
        footer {
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #user-input {
            flex: 1;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        #user-input:focus {
            border-color: var(--accent-cyan);
        }

        #send-btn {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            color: #000;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">Johnny Tec AI</div>
        <div class="status-pill">
            <span class="indicator" id="status-indicator"></span>
            <span id="status-text">Connecting...</span>
        </div>
    </header>

    <main id="chat-container">
        <div class="message-row ai">
            <div class="sender-label">Johnny Tec</div>
            <div class="bubble">Hello! I am your Johnny Tec AI assistant. How can I help you today?</div>
        </div>
    </main>

    <footer>
        <input type="text" id="user-input" placeholder="Ask Johnny Tec..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </footer>

    <script>
        // Update this URL if your Render service address changes
        const BACKEND_URL = "https://johnny-tec-backend.onrender.com";

        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const statusIndicator = document.getElementById("status-indicator");
        const statusText = document.getElementById("status-text");

        // Ping backend status on startup
        async function checkServerHealth() {
            try {
                const res = await fetch(`${BACKEND_URL}/health`);
                if (res.ok) {
                    statusIndicator.classList.add("online");
                    statusText.innerText = "Online";
                } else {
                    throw new Error();
                }
            } catch (err) {
                statusIndicator.classList.remove("online");
                statusText.innerText = "Offline / Idle";
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(sender, text) {
            const row = document.createElement("div");
            row.className = `message-row ${sender}`;

            const label = document.createElement("div");
            label.className = "sender-label";
            label.innerText = sender === "user" ? "You" : "Johnny Tec";

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.innerText = text;

            row.appendChild(label);
            row.appendChild(bubble);
            chatContainer.appendChild(row);

            scrollToBottom();
            return row;
        }

        function showTypingIndicator() {
            const row = document.createElement("div");
            row.className = "message-row ai";
            row.id = "typing-row";

            const label = document.createElement("div");
            label.className = "sender-label";
            label.innerText = "Johnny Tec";

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;

            row.appendChild(label);
            row.appendChild(bubble);
            chatContainer.appendChild(row);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const typingRow = document.getElementById("typing-row");
            if (typingRow) typingRow.remove();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // UI Adjustments
            appendMessage("user", text);
            userInput.value = "";
            userInput.disabled = true;
            sendBtn.disabled = true;
            showTypingIndicator();

            try {
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: 1, prompt: text })
                });

                removeTypingIndicator();

                if (response.ok) {
                    const data = await response.json();
                    appendMessage("ai", data.response);
                } else {
                    appendMessage("ai", "Sorry, I ran into an issue processing that request.");
                }
            } catch (err) {
                removeTypingIndicator();
                appendMessage("ai", "Unable to reach server. Please verify your connection.");
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // Allow pressing Enter key to send
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        // Initialize health ping
        checkServerHealth();
    </script>
</body>
</html>
