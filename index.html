<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Johnny Tec AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- FULL-SCREEN SPLASH LOADING SCREEN -->
<div id="loading-screen">
    <div class="splash-center">
        <!-- JT Glowing Ring & Logo -->
        <div class="logo-ring-container">
            <div class="glowing-ring"></div>
            <div class="logo-inner">
                <span class="jt-text">JT</span>
            </div>
        </div>

        <!-- Titles -->
        <h1 class="title">Johnny Tec.Dev</h1>
        <p class="subtitle">Building Digital Excellence</p>

        <!-- Loading Progress Bar -->
        <div class="loading-box">
            <div class="loading-label">LOADING</div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-percent" id="progress-percent">0%</div>
        </div>
    </div>

    <!-- 4 Feature Badges -->
    <div class="features-row">
        <div class="feature-item">
            <div class="feature-icon">&lt;/&gt;</div>
            <span class="feature-label">Clean Code</span>
        </div>
        <div class="feature-item">
            <div class="feature-icon">⚡</div>
            <span class="feature-label">High Performance</span>
        </div>
        <div class="feature-item">
            <div class="feature-icon">🛡️</div>
            <span class="feature-label">Secure</span>
        </div>
        <div class="feature-item">
            <div class="feature-icon">🚀</div>
            <span class="feature-label">Always Improving</span>
        </div>
    </div>

    <!-- Quote -->
    <div class="quote-box">
        <span class="quote-line"></span>
        <span class="quote-text">“Code. Create. Innovate.”</span>
        <span class="quote-line"></span>
    </div>
</div>

<!-- MAIN CHAT APPLICATION -->
<div id="app-container">
    <header>
        <button class="icon-btn" onclick="toggleDrawer()">☰</button>
        <div class="header-title-group">
            <span class="brand-title">Johnny Tec AI</span>
            <span class="status-dot online"></span>
        </div>
        <button class="icon-btn" onclick="toggleRightMenu()">⋮</button>
    </header>

    <main id="chat-container"></main>

    <footer>
        <input type="text" id="user-input" placeholder="Ask Johnny Tec..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">➔</button>
    </footer>

    <!-- Left Menu Drawer -->
    <div class="drawer" id="left-drawer">
        <div class="drawer-header">
            <span class="drawer-title">Menu</span>
            <button class="icon-btn" onclick="toggleDrawer()">✕</button>
        </div>
        <button class="btn-new-chat" onclick="createNewChat()">
            <span>＋</span> New Chat
        </button>
        <div class="history-label">CHAT HISTORY</div>
        <div class="history-list" id="history-list"></div>
    </div>

    <!-- Right Options Dropdown -->
    <div class="dropdown-menu" id="right-menu">
        <div class="dropdown-item" onclick="openPinnedModal()"><span>📌</span> Pinned Messages</div>
        <div class="dropdown-item" onclick="shareConversation()"><span>📤</span> Share Conversation</div>
        <div class="dropdown-item danger" onclick="deleteCurrentChat()"><span>🗑️</span> Clear Chat</div>
    </div>

    <div class="backdrop" id="backdrop" onclick="closeAllOverlays()"></div>

    <!-- Pinned Messages Modal -->
    <div class="modal" id="pinned-modal">
        <h3>Pinned Messages 📌</h3>
        <div id="pinned-content" style="max-height: 250px; overflow-y: auto;"></div>
        <button class="modal-close" onclick="closeAllOverlays()">Close</button>
    </div>

    <div class="toast" id="toast-msg">Notification</div>
</div>

<!-- Scripts (AI Brain loaded before main script) -->
<script src="ai-brain.js"></script>
<script src="script.js"></script>
</body>
    </html>
